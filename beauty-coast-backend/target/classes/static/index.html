<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Coast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- VISUAL IOS --- */
        :root { --bg-body: #F2F2F7; --bg-card: #FFFFFF; --text-main: #000000; --input-bg: #F2F2F7; --accent: #FF2D55; --accent-soft: #FFE4E8; --nav-bg: rgba(255, 255, 255, 0.9); }
        [data-mode="dark"] { --bg-body: #000000; --bg-card: #1C1C1E; --text-main: #FFFFFF; --input-bg: #2C2C2E; --accent: #FF375F; --accent-soft: #2C2C2E; --nav-bg: rgba(28, 28, 30, 0.85); }
        [data-color="gold"] { --accent: #C0A080; --accent-soft: #F0E5D5; }
        [data-color="purple"] { --accent: #8B5CF6; --accent-soft: #EDE9FE; }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; transition: background 0.4s; }
        .ios-card { background-color: var(--bg-card); border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); transition: background 0.4s; }
        .ios-input { width: 100%; background-color: var(--input-bg); border: none; padding: 14px; border-radius: 14px; outline: none; color: var(--text-main); font-weight: 500; }
        
        /* --- ESTILO DO CALENDÁRIO COM BOLINHAS --- */
        .calendar-day { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; cursor: pointer; transition: 0.2s; position: relative; }
        .calendar-day.active { background-color: var(--accent); color: white; font-weight: 700; }

        /* A Mágica: Bolinha do agendamento */
        .has-appointment::after {
            content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px;
            background-color: var(--accent); border-radius: 50%;
        }
        /* Quando o dia está selecionado, a bolinha fica branca */
        .calendar-day.active.has-appointment::after { background-color: white; }

        .service-btn { background-color: var(--input-bg); padding: 12px; border-radius: 14px; width: 100%; text-align: center; opacity: 0.7; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; }
        .service-btn.selected { border-color: var(--accent); background-color: var(--accent-soft); color: var(--accent); opacity: 1; font-weight: bold; }
        .pay-btn { width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 13px; border: 1px solid #ffcccc; background: #fff0f0; color: #ff3b30; }
        .pay-btn.paid { background: #d4f7dc; color: #00c950; border-color: #bbf0c8; }
        .bottom-nav { background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.05); }
        
        /* Botões da Calculadora */
        .calc-btn { height: 60px; border-radius: 16px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; background-color: var(--input-bg); transition: 0.1s; }
        .calc-btn:active { transform: scale(0.95); opacity: 0.8; }
        .calc-op { color: var(--accent); background-color: var(--accent-soft); }
        .calc-eq { background-color: var(--accent); color: white; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body class="pb-32 pt-4">

    <main id="view-calendar" class="px-5 max-w-md mx-auto space-y-6">
        <div class="ios-card p-6">
            <div class="flex justify-between items-center mb-6">
                <p class="text-[10px] font-black text-accent uppercase tracking-[0.2em]">Beauty Coast</p>
                <div class="flex gap-2">
                    <button onclick="cycleColor()" class="w-8 h-8 rounded-full bg-[var(--input-bg)] flex items-center justify-center text-accent"><i class="fas fa-palette text-xs"></i></button>
                    <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-[var(--input-bg)] flex items-center justify-center text-gray-500"><i id="mode-icon" class="fas fa-moon text-xs"></i></button>
                </div>
            </div>
            <div class="flex items-center justify-between mb-8 px-2">
                <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-full hover:bg-[var(--input-bg)] flex items-center justify-center text-gray-400"><i class="fas fa-chevron-left"></i></button>
                <div class="text-center">
                    <h1 class="text-2xl font-black" id="month-display">Janeiro</h1>
                    <p class="text-xs font-bold opacity-40 uppercase tracking-widest mt-1" id="year-display">2026</p>
                </div>
                <button onclick="changeMonth(1)" class="w-10 h-10 rounded-full hover:bg-[var(--input-bg)] flex items-center justify-center text-gray-400"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="grid grid-cols-7 text-center mb-4 text-[9px] font-bold opacity-40 uppercase">
                <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-y-4 text-center"></div>
        </div>

        <div>
            <div class="flex items-center gap-3 mb-4 ml-2">
                <div class="w-1.5 h-1.5 rounded-full" style="background-color: var(--accent)"></div>
                <h2 class="text-lg font-bold">Agenda do Dia</h2>
            </div>
            <div id="appointment-list" class="space-y-3"></div>
        </div>
    </main>

    <main id="view-inventory" class="px-5 max-w-md mx-auto space-y-6 hidden">
        <div class="ios-card p-6 flex justify-between items-center bg-gradient-to-r from-[var(--bg-card)] to-[var(--input-bg)]">
            <div><p class="text-[10px] font-black text-accent uppercase tracking-[0.2em]">Gestão</p><h1 class="text-2xl font-black mt-1">Meu Estoque</h1></div>
            <button onclick="openProductModal()" class="w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-white active:scale-90 transition" style="background-color: var(--accent)"><i class="fas fa-plus text-lg"></i></button>
        </div>
        <div>
            <div class="flex items-center gap-3 mb-4 ml-2"><div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div><h2 class="text-lg font-bold opacity-60">Produtos</h2></div>
            <div id="product-list" class="space-y-3"><p class="text-center opacity-40 py-10 italic">Carregando...</p></div>
        </div>
    </main>

    <main id="view-calculator" class="px-5 max-w-md mx-auto space-y-6 hidden">
        <div class="ios-card p-6">
            <div class="flex justify-between items-center mb-6">
                <p class="text-[10px] font-black text-accent uppercase tracking-[0.2em]">Calculadora</p>
            </div>
            
            <div class="bg-[var(--input-bg)] p-6 rounded-2xl mb-6 text-right h-24 flex flex-col justify-end">
                <div id="calc-preview" class="text-xs font-bold opacity-40 h-4"></div>
                <div id="calc-display" class="text-4xl font-bold truncate">0</div>
            </div>

            <div class="grid grid-cols-4 gap-3">
                <button onclick="calcClear()" class="calc-btn text-red-500">C</button>
                <button onclick="calcOp('/')" class="calc-btn calc-op"><i class="fas fa-divide text-sm"></i></button>
                <button onclick="calcOp('*')" class="calc-btn calc-op"><i class="fas fa-times text-sm"></i></button>
                <button onclick="calcBackspace()" class="calc-btn text-orange-400"><i class="fas fa-backspace text-sm"></i></button>
                
                <button onclick="calcNum(7)" class="calc-btn">7</button>
                <button onclick="calcNum(8)" class="calc-btn">8</button>
                <button onclick="calcNum(9)" class="calc-btn">9</button>
                <button onclick="calcOp('-')" class="calc-btn calc-op"><i class="fas fa-minus text-sm"></i></button>
                
                <button onclick="calcNum(4)" class="calc-btn">4</button>
                <button onclick="calcNum(5)" class="calc-btn">5</button>
                <button onclick="calcNum(6)" class="calc-btn">6</button>
                <button onclick="calcOp('+')" class="calc-btn calc-op"><i class="fas fa-plus text-sm"></i></button>
                
                <button onclick="calcNum(1)" class="calc-btn">1</button>
                <button onclick="calcNum(2)" class="calc-btn">2</button>
                <button onclick="calcNum(3)" class="calc-btn">3</button>
                <button onclick="calcResult()" class="calc-btn calc-eq row-span-2 text-2xl">=</button>
                
                <button onclick="calcNum(0)" class="calc-btn col-span-2">0</button>
                <button onclick="calcNum('.')" class="calc-btn">.</button>
            </div>
        </div>
    </main>

    <div id="modal-new" class="fixed inset-0 bg-black/60 backdrop-blur-md z-[60] hidden flex items-end sm:items-center justify-center">
        <div class="bg-card w-full sm:w-96 p-6 rounded-t-3xl sm:rounded-3xl ios-card shadow-2xl h-[90vh] sm:h-auto overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div><span class="text-[10px] font-bold text-accent uppercase">AGENDA</span><h3 class="text-xl font-bold" id="modal-day-display">--</h3></div>
                <button onclick="closeModal('modal-new')" class="w-8 h-8 bg-[var(--input-bg)] rounded-full text-gray-500 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5 rounded-2xl mb-6 bg-[var(--bg-body)]">
                <input type="text" id="inp-guest-name" class="ios-input mb-3" style="background-color: var(--bg-card);" placeholder="Nome Cliente">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button onclick="toggleService('Maquiagem')" class="service-btn" id="btn-maq" style="background-color: var(--bg-card);"><i class="fas fa-magic"></i> Make</button>
                    <button onclick="toggleService('Cabelo')" class="service-btn" id="btn-cab" style="background-color: var(--bg-card);"><i class="fas fa-cut"></i> Cabelo</button>
                </div>
                <button onclick="addGuestToList()" class="w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wide transition hover:opacity-80" style="background-color: var(--text-main); color: var(--bg-card);">Incluir</button>
            </div>
            <div id="guest-list-container" class="space-y-2 mb-6"></div>
            <div class="bg-[var(--input-bg)] p-5 rounded-2xl mb-4">
                <div class="flex gap-4 mb-4">
                    <div class="w-1/2"><label class="text-[10px] font-bold opacity-50 block mb-1">HORA</label><input type="time" id="inp-time" class="ios-input text-center font-bold" style="background-color: var(--bg-card);"></div>
                    <div class="w-1/2"><label class="text-[10px] font-bold opacity-50 block mb-1">TOTAL</label><input type="number" id="inp-price" class="ios-input text-center font-bold text-accent" style="background-color: var(--bg-card);" placeholder="0"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-sinal" onclick="togglePayState('sinal')" class="pay-btn">Sinal?</button>
                    <button id="btn-pago" onclick="togglePayState('pago')" class="pay-btn">Pago?</button>
                </div>
            </div>
            <button onclick="saveAppointment()" class="w-full py-4 rounded-xl font-bold text-white shadow-lg text-sm uppercase tracking-wide" style="background-color: var(--accent)">Salvar Agendamento</button>
        </div>
    </div>

    <div id="modal-product" class="fixed inset-0 bg-black/60 backdrop-blur-md z-[60] hidden flex items-end sm:items-center justify-center">
        <div class="bg-card w-full sm:w-96 p-6 rounded-t-3xl sm:rounded-3xl ios-card shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Novo Produto</h3>
                <button onclick="closeModal('modal-product')" class="w-8 h-8 bg-[var(--input-bg)] rounded-full text-gray-500 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <div><label class="text-[10px] font-bold opacity-50 ml-1 uppercase">Marca</label><input type="text" id="prod-brand" class="ios-input" placeholder="Ex: Dior, Mac"></div>
                <div><label class="text-[10px] font-bold opacity-50 ml-1 uppercase">Produto</label><input type="text" id="prod-name" class="ios-input" placeholder="Ex: Base Matte"></div>
                <div><label class="text-[10px] font-bold opacity-50 ml-1 uppercase">Custo (R$)</label><input type="number" id="prod-price" class="ios-input font-bold text-accent" placeholder="0.00"></div>
                <button onclick="saveProduct()" class="w-full py-4 mt-2 rounded-xl font-bold text-white shadow-lg text-sm uppercase tracking-wide" style="background-color: var(--accent)">Cadastrar</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bottom-nav rounded-full py-3 px-8 flex items-center gap-12 z-50 shadow-2xl">
        <button onclick="switchTab('calculator')" id="tab-calculator" class="opacity-40 hover:opacity-100 transition flex flex-col items-center">
            <i class="fas fa-calculator text-xl mb-1"></i>
            <span class="text-[8px] font-bold uppercase">Calc</span>
        </button>
        
        <button onclick="switchTab('calendar')" id="tab-calendar" class="w-14 h-14 -mt-10 bg-[var(--accent)] rounded-full text-white border-[4px] border-[var(--bg-body)] shadow-lg transform hover:scale-105 transition flex items-center justify-center">
            <i class="fas fa-calendar-alt text-xl"></i>
        </button>

        <button onclick="switchTab('inventory')" id="tab-inventory" class="opacity-40 hover:opacity-100 transition flex flex-col items-center">
            <i class="fas fa-box-open text-xl mb-1"></i>
            <span class="text-[8px] font-bold uppercase">Estoque</span>
        </button>
    </nav>

    <script>
        // --- GERAL ---
        let currentTab = 'calendar';
        const colors = [null, 'gold', 'purple']; 
        let colorIndex = localStorage.getItem('themeColor') || 0;
        let isDark = localStorage.getItem('themeMode') === 'true';

        function initTheme() {
            if(colors[colorIndex]) document.documentElement.setAttribute('data-color', colors[colorIndex]);
            if(isDark) { document.documentElement.setAttribute('data-mode', 'dark'); document.getElementById('mode-icon').classList.replace('fa-moon', 'fa-sun'); }
        }
        initTheme();

        function toggleDarkMode() { 
            isDark = !isDark; 
            const icon = document.getElementById('mode-icon');
            if(isDark) { document.documentElement.setAttribute('data-mode', 'dark'); icon.classList.replace('fa-moon', 'fa-sun'); } 
            else { document.documentElement.removeAttribute('data-mode'); icon.classList.replace('fa-sun', 'fa-moon'); }
            localStorage.setItem('themeMode', isDark); 
        }

        function cycleColor() { 
            colorIndex = (parseInt(colorIndex)+1)%colors.length; const c = colors[colorIndex]; 
            if(c) document.documentElement.setAttribute('data-color',c); else document.documentElement.removeAttribute('data-color'); 
            localStorage.setItem('themeColor',colorIndex); 
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('view-calendar').classList.add('hidden');
            document.getElementById('view-inventory').classList.add('hidden');
            document.getElementById('view-calculator').classList.add('hidden');
            
            // Reseta estilos
            const btnCal = document.getElementById('tab-calendar');
            const btnInv = document.getElementById('tab-inventory');
            const btnCalc = document.getElementById('tab-calculator');
            
            [btnCal, btnInv, btnCalc].forEach(b => {
                b.className = "opacity-40 hover:opacity-100 transition flex flex-col items-center";
                b.innerHTML = b.innerHTML; // Reset content
            });
            // Restaura ícones pequenos
            btnCal.innerHTML = `<i class="fas fa-calendar-alt text-xl mb-1"></i><span class="text-[8px] font-bold uppercase">Agenda</span>`;
            
            if(tab === 'calendar') {
                document.getElementById('view-calendar').classList.remove('hidden');
                btnCal.className = "w-14 h-14 -mt-10 bg-[var(--accent)] rounded-full text-white border-[4px] border-[var(--bg-body)] shadow-lg transform hover:scale-105 transition flex items-center justify-center";
                btnCal.innerHTML = `<i class="fas fa-calendar-alt text-xl"></i>`;
            } else if (tab === 'inventory') {
                document.getElementById('view-inventory').classList.remove('hidden');
                loadProducts();
                btnInv.className = "text-[var(--accent)] flex flex-col items-center scale-110";
            } else if (tab === 'calculator') {
                document.getElementById('view-calculator').classList.remove('hidden');
                btnCalc.className = "text-[var(--accent)] flex flex-col items-center scale-110";
            }
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // --- CALCULADORA ---
        let calcExpr = "";
        function calcNum(n) { calcExpr += n; updateCalc(); }
        function calcOp(op) { calcExpr += op; updateCalc(); }
        function calcClear() { calcExpr = ""; document.getElementById('calc-preview').innerText = ""; updateCalc(); }
        function calcBackspace() { calcExpr = calcExpr.slice(0, -1); updateCalc(); }
        function updateCalc() { document.getElementById('calc-display').innerText = calcExpr || "0"; }
        function calcResult() {
            try {
                // Avaliação simples (segura para uso local assim)
                const res = eval(calcExpr);
                document.getElementById('calc-preview').innerText = calcExpr + " =";
                calcExpr = String(res);
                document.getElementById('calc-display').innerText = calcExpr;
            } catch (e) {
                document.getElementById('calc-display').innerText = "Erro";
                setTimeout(calcClear, 1000);
            }
        }

        // --- AGENDA ---
        let currentDate = new Date(); let selectedDay = null; let currentGuestServices = []; let fullGuestList = []; let payStatus = { sinal: false, pago: false }; let editingId = null;
        const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        document.addEventListener('DOMContentLoaded', () => { renderCalendar(); loadAppointments(); });
        function changeMonth(s) { currentDate.setMonth(currentDate.getMonth()+s); renderCalendar(); loadAppointments(); }
        
        function renderCalendar() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth();
            document.getElementById('month-display').innerText = months[m]; document.getElementById('year-display').innerText = y;
            const fd = new Date(y, m, 1).getDay(), dim = new Date(y, m+1, 0).getDate();
            const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
            for(let i=0; i<fd; i++) grid.innerHTML += `<div></div>`;
            for(let i=1; i<=dim; i++) {
                let c = 'calendar-day'; const now = new Date();
                if(i===now.getDate() && m===now.getMonth() && y===now.getFullYear()) c += ' active';
                grid.innerHTML += `<div class="${c}" onclick="openModal(${i})">${i}</div>`;
            }
        }

        function openModal(day) {
            selectedDay = day; editingId = null;
            document.getElementById('modal-day-display').innerText = `${day} de ${months[currentDate.getMonth()]}`;
            fullGuestList = []; resetGuestInput(); updateGuestListUI();
            document.getElementById('inp-price').value = ''; document.getElementById('inp-time').value = '14:00';
            payStatus = { sinal: false, pago: false }; updatePayButtons();
            document.getElementById('modal-new').classList.remove('hidden');
        }

        function editAppointment(app) {
            selectedDay = new Date(app.dateTime).getDate(); editingId = app.id;
            document.getElementById('modal-day-display').innerText = "Editar " + app.clientName.split('+')[0];
            const d = new Date(app.dateTime); document.getElementById('inp-time').value = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('inp-price').value = app.price;
            payStatus = { sinal: app.status==='Sinal', pago: app.status==='Pago' }; updatePayButtons();
            fullGuestList = []; updateGuestListUI();
            document.getElementById('guest-list-container').innerHTML = `<p class="text-xs text-center opacity-60 italic">Adicione novas pessoas para alterar a lista.</p>`;
            document.getElementById('modal-new').classList.remove('hidden');
        }

        function toggleService(t) {
            const btn = document.getElementById(t==='Maquiagem'?'btn-maq':'btn-cab');
            if(currentGuestServices.includes(t)) { currentGuestServices=currentGuestServices.filter(s=>s!==t); btn.classList.remove('selected'); }
            else { currentGuestServices.push(t); btn.classList.add('selected'); }
        }

        function addGuestToList() {
            const n = document.getElementById('inp-guest-name').value; if(!n) return;
            fullGuestList.push({ name: n, services: [...currentGuestServices] }); resetGuestInput(); updateGuestListUI();
        }
        function resetGuestInput() {
            document.getElementById('inp-guest-name').value = ''; currentGuestServices = [];
            document.getElementById('btn-maq').classList.remove('selected'); document.getElementById('btn-cab').classList.remove('selected');
            document.getElementById('inp-guest-name').focus();
        }
        function updateGuestListUI() {
            const c = document.getElementById('guest-list-container');
            if(fullGuestList.length===0) { c.innerHTML = '<p class="text-xs opacity-40 text-center italic">Ninguém adicionado.</p>'; return; }
            c.innerHTML = fullGuestList.map((g,i) => `<div class="guest-item shadow-sm"><span><b>${g.name}</b> <span class="opacity-50 text-[10px]">(${g.services.join('+')})</span></span><button onclick="fullGuestList.splice(${i},1); updateGuestListUI()" class="text-red-400"><i class="fas fa-times"></i></button></div>`).join('');
        }
        function togglePayState(t) { if(t==='sinal') payStatus.sinal=!payStatus.sinal; if(t==='pago') { payStatus.pago=!payStatus.pago; if(payStatus.pago) payStatus.sinal=true; } updatePayButtons(); }
        function updatePayButtons() {
            const s=document.getElementById('btn-sinal'), p=document.getElementById('btn-pago');
            s.className=`pay-btn ${payStatus.sinal?'paid':''}`; s.innerText=payStatus.sinal?'Sinal OK':'Sinal?';
            p.className=`pay-btn ${payStatus.pago?'paid':''}`; p.innerText=payStatus.pago?'Pago Total':'Pago?';
        }

        function saveAppointment() {
            const p = parseFloat(document.getElementById('inp-price').value)||0, t = document.getElementById('inp-time').value;
            const y=currentDate.getFullYear(), m=currentDate.getMonth()+1;
            const dt = `${y}-${m<10?'0'+m:m}-${selectedDay<10?'0'+selectedDay:selectedDay}T${t}:00`;
            let stat = 'Pendente'; if(payStatus.sinal) stat='Sinal'; if(payStatus.pago) stat='Pago';
            let desc="", name="";
            if(fullGuestList.length>0) { desc=fullGuestList.map(g=>`${g.name} (${g.services.join('+')})`).join(', '); name=fullGuestList[0].name + (fullGuestList.length>1?` +${fullGuestList.length-1}`:''); }
            else if(editingId) { name="Editado"; desc="Ver detalhes"; } else { alert("Adicione pessoas!"); return; }
            
            fetch('/api/appointments', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:editingId, clientName:name, serviceType:desc, dateTime:dt, price:p, status:stat}) })
            .then(()=>{ closeModal('modal-new'); loadAppointments(); });
        }
        function deleteApp(id, e) { e.stopPropagation(); if(confirm("Apagar?")) fetch(`/api/appointments/${id}`, {method:'DELETE'}).then(()=>loadAppointments()); }

        // --- FUNÇÃO CORRIGIDA COM AS BOLINHAS ---
        function loadAppointments() {
            fetch('/api/appointments').then(r=>r.json()).then(data => {
                const list = document.getElementById('appointment-list'); list.innerHTML = '';
                
                // 1. Limpa bolinhas antigas
                document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('has-appointment'));

                // 2. Filtra agendamentos e coloca as bolinhas
                const f = data.filter(a => { 
                    const d=new Date(a.dateTime); 
                    const isSameMonth = d.getMonth()===currentDate.getMonth() && d.getFullYear()===currentDate.getFullYear();
                    
                    if (isSameMonth) {
                        const diaDoApp = d.getDate();
                        const diasNaTela = document.querySelectorAll('.calendar-day');
                        diasNaTela.forEach(div => {
                            if(parseInt(div.innerText) === diaDoApp) div.classList.add('has-appointment');
                        });
                    }
                    return isSameMonth;
                });

                if(f.length===0) { list.innerHTML = `<p class="opacity-40 text-center py-8 text-sm italic">Nada em ${months[currentDate.getMonth()]}.</p>`; return; }
                
                f.sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime));
                
                f.forEach(a => {
                    const d=new Date(a.dateTime), h=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
                    let pc="bg-red-50 text-red-500", st="Pendente"; if(a.status==='Sinal'){pc="bg-orange-50 text-orange-500";st="Sinal";} if(a.status==='Pago'){pc="bg-green-50 text-green-600";st="Pago";}
                    
                    list.innerHTML += `<div class="ios-card p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 transition" onclick="editAppointment({id:${a.id}, clientName:'${a.clientName}', price:${a.price}, dateTime:'${a.dateTime}', status:'${a.status}'})">
                        <div class="flex items-center gap-4"><div class="text-center pr-4 border-r border-gray-100 dark:border-white/10 min-w-[50px]"><span class="text-[10px] font-bold opacity-40 block uppercase">Dia ${d.getDate()}</span><span class="text-xl font-bold">${h}</span></div><div><h3 class="font-bold text-base truncate max-w-[140px]">${a.clientName}</h3><p class="text-xs opacity-50 truncate max-w-[140px]">${a.serviceType}</p></div></div>
                        <div class="flex items-center gap-3"><div class="text-right"><div class="text-[10px] font-bold ${pc} px-2 py-1 rounded mb-1 inline-block">${st}</div><div class="text-sm font-bold block">R$ ${(a.price||0).toFixed(2)}</div></div><button onclick="deleteApp(${a.id}, event)" class="bg-gray-50 dark:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center text-gray-300 hover:text-red-500 transition"><i class="fas fa-trash-alt text-xs"></i></button></div></div>`;
                });
            });
        }

        // --- ESTOQUE ---
        function openProductModal() {
            document.getElementById('prod-brand').value=''; document.getElementById('prod-name').value=''; document.getElementById('prod-price').value='';
            document.getElementById('modal-product').classList.remove('hidden');
        }
        function saveProduct() {
            const b = document.getElementById('prod-brand').value, n = document.getElementById('prod-name').value, p = document.getElementById('prod-price').value;
            if(!b || !n) { alert("Preencha marca e nome!"); return; }
            fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({brand:b, name:n, price:parseFloat(p)||0}) })
            .then(()=>{ closeModal('modal-product'); loadProducts(); });
        }
        function deleteProd(id) { if(confirm("Remover do estoque?")) fetch(`/api/products/${id}`, {method:'DELETE'}).then(()=>loadProducts()); }
        
        function loadProducts() {
            fetch('/api/products').then(r=>r.json()).then(data => {
                const l = document.getElementById('product-list'); l.innerHTML = '';
                if(data.length===0) { l.innerHTML='<div class="text-center py-10 opacity-50"><i class="fas fa-box-open text-4xl mb-2"></i><p>Estoque vazio.</p></div>'; return; }
                data.forEach(p => {
                    l.innerHTML += `
                    <div class="ios-card p-4 flex justify-between items-center group">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-[var(--input-bg)] flex items-center justify-center text-[var(--accent)] font-bold text-xs uppercase">${p.brand.substring(0,2)}</div>
                            <div><p class="text-[10px] font-bold text-accent uppercase mb-0.5 tracking-wider">${p.brand}</p><p class="font-bold text-base leading-tight">${p.name}</p></div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-bold opacity-60">R$ ${(p.price||0).toFixed(2)}</span>
                            <button onclick="deleteProd(${p.id})" class="text-gray-300 hover:text-red-500 transition p-2"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
